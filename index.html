<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>🎣 Рыбалка на речке</title>
<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1a2a3a; font-family: sans-serif; overflow: hidden; }
  canvas { box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 10px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 900, H = 600;
canvas.width = W; canvas.height = H;

// Состояния игры
const S = { IDLE:0, CASTING:1, WAITING:2, BITE:3, REELING:4, RESULT:5 };
let state = S.IDLE;
let score = 0, best = parseInt(localStorage.getItem('fishBest')||'0');
let timer = 0, waitTime = 0, biteTime = 0, reelPos = 0, zoneStart = 0, zoneEnd = 0;
let catchResult = null;
let particles = [];

const rod = { baseX: 100, baseY: 480, tipX: 180, tipY: 380 };
const bobber = { x: 0, y: 0, tx: 0, ty: 0, vx: 0, vy: 0, phase: 0 };

const FISH = [
  { name: 'Окунь', color: '#e8a020', size: 25, pts: 10, weight: 35 },
  { name: 'Карась', color: '#d4b048', size: 30, pts: 15, weight: 30 },
  { name: 'Щука', color: '#4a8a3a', size: 45, pts: 30, weight: 18 },
  { name: 'Сом', color: '#5a4a3a', size: 55, pts: 50, weight: 10 },
  { name: 'Золотая рыбка', color: '#ffd700', size: 25, pts: 100, weight: 4 },
  { name: 'Ботинок', color: '#3a3a3a', size: 35, pts: 1, weight: 3 }
];

// Декоративные рыбы
let bgFish = [];
for(let i=0; i<10; i++) bgFish.push({ x: Math.random()*W, y: 340+Math.random()*230, speed: 0.5+Math.random(), dir: Math.random()>0.5?1:-1, size: 8+Math.random()*8, color: FISH[Math.floor(Math.random()*4)].color });

function spawnParticles(x, y, color, count) {
  for(let i=0; i<count; i++) particles.push({ x, y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4-2, life: 1, color, size: 2+Math.random()*4 });
}

function showResult(text, color) {
  catchResult = { text, color, timer: 0 };
  state = S.RESULT;
}

// Управление
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);
  
  if (state === S.IDLE) {
    // Заброс
    bobber.x = rod.tipX; bobber.y = rod.tipY;
    bobber.tx = Math.max(300, Math.min(W-50, mx));
    bobber.ty = Math.max(330, Math.min(H-50, my));
    const dist = Math.hypot(bobber.tx - bobber.x, bobber.ty - bobber.y);
    const t = dist / 800;
    bobber.vx = (bobber.tx - bobber.x) / t;
    bobber.vy = (bobber.ty - bobber.y) / t - 400 * t;
    state = S.CASTING;
  } 
  else if (state === S.BITE) {
    // Подсечка
    if (biteTime > 0) {
      state = S.REELING;
      reelPos = 0;
      zoneStart = 25 + Math.random() * 40;
      zoneEnd = zoneStart + 15 + Math.random() * 15;
    }
  }
  else if (state === S.REELING) {
    // Вываживание
    if (reelPos >= zoneStart && reelPos <= zoneEnd) {
      // Успех
      let r = Math.random() * 100, fish = FISH[0];
      for (let f of FISH) { r -= f.weight; if (r <= 0) { fish = f; break; } }
      score += fish.pts;
      if (score > best) { best = score; localStorage.setItem('fishBest', best); }
      spawnParticles(bobber.x, bobber.y, fish.color, 20);
      showResult(`+${fish.pts} ${fish.name}!`, fish.color);
    } else {
      // Промах
      showResult('Упустил!', '#ff6666');
    }
  }
  else if (state === S.RESULT && catchResult.timer > 0.5) {
    state = S.IDLE;
    catchResult = null;
  }
});

function update(dt) {
  timer += dt;
  
  // Фоновые рыбы
  for(let f of bgFish) {
    f.x += f.speed * f.dir;
    if(f.x > W+30) { f.x = -30; f.y = 340+Math.random()*230; }
    if(f.x < -30) { f.x = W+30; f.y = 340+Math.random()*230; }
  }
  
  // Частицы
  for(let i=particles.length-1; i>=0; i--) {
    let p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life -= dt*2;
    if(p.life <= 0) particles.splice(i,1);
  }

  // Логика
  if (state === S.CASTING) {
    bobber.x += bobber.vx * dt;
    bobber.y += bobber.vy * dt;
    bobber.vy += 800 * dt;
    if (bobber.y >= bobber.ty && bobber.vy > 0) {
      bobber.y = bobber.ty;
      state = S.WAITING;
      waitTime = 1.5 + Math.random() * 4;
      spawnParticles(bobber.x, bobber.y, '#aaddff', 10);
    }
  }
  else if (state === S.WAITING) {
    waitTime -= dt;
    bobber.phase += dt * 2;
    if (waitTime <= 0) {
      state = S.BITE;
      biteTime = 0.9;
      spawnParticles(bobber.x, bobber.y, '#fff', 15);
    }
  }
  else if (state === S.BITE) {
    biteTime -= dt;
    if (biteTime <= 0) showResult('Сорвалась!', '#ff6666');
  }
  else if (state === S.REELING) {
    reelPos += dt * 80;
    if (reelPos > 100) reelPos = 0;
  }
  else if (state === S.RESULT) {
    catchResult.timer += dt;
    if (catchResult.timer > 2) { state = S.IDLE; catchResult = null; }
  }
}

function draw() {
  // Небо
  let sky = ctx.createLinearGradient(0,0,0,300);
  sky.addColorStop(0,'#87CEEB'); sky.addColorStop(1,'#ffd9a0');
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,300);
  
  // Солнце
  ctx.fillStyle = 'rgba(255,250,200,0.8)';
  ctx.beginPath(); ctx.arc(750, 100, 40, 0, Math.PI*2); ctx.fill();
  
  // Холмы
  ctx.fillStyle = '#6a8a5a';
  ctx.beginPath(); ctx.moveTo(0,300);
  for(let x=0; x<=W; x+=40) ctx.lineTo(x, 280 + Math.sin(x*0.01)*20);
  ctx.lineTo(W,300); ctx.fill();
  
  // Вода
  let water = ctx.createLinearGradient(0,300,0,H);
  water.addColorStop(0,'#3a7ca8'); water.addColorStop(1,'#1a3a5a');
  ctx.fillStyle = water; ctx.fillRect(0,300,W,H-300);
  
  // Волны
  ctx.strokeStyle = 'rgba(150,200,255,0.3)'; ctx.lineWidth = 2;
  for(let i=0; i<6; i++) {
    ctx.beginPath();
    for(let x=0; x<=W; x+=10) {
      let y = 330 + i*40 + Math.sin(x*0.02 + timer*2 + i)*3;
      if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  
  // Фоновые рыбы
  for(let f of bgFish) {
    ctx.save(); ctx.translate(f.x, f.y); ctx.scale(f.dir, 1);
    ctx.globalAlpha = 0.5; ctx.fillStyle = f.color;
    ctx.beginPath(); ctx.ellipse(0,0,f.size,f.size*0.4,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-f.size,0); ctx.lineTo(-f.size*1.5,-f.size*0.4); ctx.lineTo(-f.size*1.5,f.size*0.4); ctx.fill();
    ctx.restore();
  }
  
  // Леска и поплавок
  if (state !== S.IDLE) {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(rod.tipX, rod.tipY); ctx.quadraticCurveTo((rod.tipX+bobber.x)/2, Math.min(rod.tipY,bobber.y)-20, bobber.x, bobber.y); ctx.stroke();
    
    let by = bobber.y + (state===S.WAITING ? Math.sin(bobber.phase)*3 : state===S.BITE ? Math.sin(timer*30)*5 : 0);
    ctx.fillStyle = '#ff4444'; ctx.beginPath(); ctx.arc(bobber.x, by, 8, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(bobber.x, by, 8, 0, Math.PI); ctx.fill();
    ctx.strokeStyle = '#333'; ctx.beginPath(); ctx.arc(bobber.x, by, 8, 0, Math.PI*2); ctx.stroke();
  }
  
  // Удочка
  ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(rod.baseX, rod.baseY); ctx.quadraticCurveTo(130, 420, rod.tipX, rod.tipY); ctx.stroke();
  
  // Рыбак
  ctx.fillStyle = '#2a4a6a'; ctx.fillRect(60, 490, 15, 60); ctx.fillRect(90, 490, 15, 60);
  ctx.fillStyle = '#c0392b'; ctx.fillRect(55, 420, 55, 75);
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.moveTo(70,440); ctx.lineTo(100,460); ctx.lineTo(rod.baseX, rod.baseY); ctx.stroke();
  ctx.fillStyle = '#f0c090'; ctx.beginPath(); ctx.arc(82, 400, 22, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#5a4a2a'; ctx.beginPath(); ctx.ellipse(82, 388, 30, 8, 0, 0, Math.PI*2); ctx.fill();
  
  // Частицы
  for(let p of particles) {
    ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  
  // UI
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(20, 20, 250, 90);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(`Очки: ${score}`, 40, 55);
  ctx.fillStyle = '#ffd700'; ctx.font = '16px sans-serif';
  ctx.fillText(`Рекорд: ${best}`, 40, 85);
  
  // Мини-игра
  if (state === S.REELING) {
    let bx = 200, bw = 500, by = H - 120;
    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(bx-20, by-50, bw+40, 100);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('КЛИКНИ В ЗЕЛЁНОЙ ЗОНЕ!', W/2, by - 20);
    
    ctx.fillStyle = '#333'; ctx.fillRect(bx, by, bw, 30);
    let zx = bx + (zoneStart/100)*bw, zw = ((zoneEnd-zoneStart)/100)*bw;
    ctx.fillStyle = '#4CAF50'; ctx.fillRect(zx, by, zw, 30);
    
    let px = bx + (reelPos/100)*bw;
    ctx.fillStyle = '#fff'; ctx.fillRect(px-3, by-10, 6, 50);
  }
  
  // Подсказки
  ctx.font = '18px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,0.9)';
  let hint = '';
  if (state === S.IDLE) hint = 'Кликни в воду, чтобы забросить удочку';
  if (state === S.WAITING) hint = 'Ждём поклёвки...';
  if (state === S.BITE) { hint = 'КЛЮЁТ! Скорее кликни!'; ctx.fillStyle = '#ffdd44'; }
  if (state === S.RESULT) hint = 'Кликни, чтобы продолжить';
  
  if (hint) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(W/2-200, H-60, 400, 40);
    ctx.fillStyle = state === S.BITE ? '#ffdd44' : '#fff';
    ctx.fillText(hint, W/2, H-33);
  }
  
  // Результат
  if (catchResult) {
    ctx.globalAlpha = Math.min(1, catchResult.timer * 3);
    ctx.font = 'bold 40px sans-serif';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 5; ctx.strokeText(catchResult.text, W/2, 250);
    ctx.fillStyle = catchResult.color; ctx.fillText(catchResult.text, W/2, 250);
    ctx.globalAlpha = 1;
  }
}

let last = performance.now();
function loop(now) {
  let dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
