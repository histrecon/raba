<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🎣 Рыбалка на речке</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  /* Фон страницы */
  html, body { 
    width: 100%; height: 100%; overflow: hidden; 
    background: #0d1520; font-family: 'Segoe UI', sans-serif; 
    user-select: none; touch-action: none;
    display: flex; justify-content: center; align-items: center;
  }
  
  /* Контейнер для канваса */
  #game-container { 
    position: relative; width: 100vw; height: 100vh; 
    display: flex; justify-content: center; align-items: center;
    background: #0d1520;
  }
  
  /* Канвас: вписывается целиком на любом экране */
  canvas { 
    display: block; width: 100%; height: 100%;
    object-fit: contain; /* ВАЖНО: сохраняет пропорции и показывает ВСЁ поле */
    touch-action: none;
  }
  
  /* Панель кнопок (теперь внизу справа, чтобы не мешать) */
  .top-panel {
    position: absolute; bottom: 15px; right: 15px;
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
    max-width: 250px; z-index: 5;
  }
  
  .btn {
    color: white; border: 2px solid; padding: 8px 12px; border-radius: 8px;
    font-weight: bold; font-size: 14px; cursor: pointer; transition: transform 0.1s;
    backdrop-filter: blur(4px); white-space: nowrap;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .btn:active { transform: scale(0.92); }
  
  #catalogBtn { background: rgba(60, 120, 200, 0.85); border-color: rgba(100,180,255,0.5); }
  #shopBtn { background: rgba(60, 180, 100, 0.85); border-color: rgba(100,255,150,0.5); }
  #soundBtn { background: rgba(200, 180, 60, 0.85); border-color: rgba(255,220,100,0.5); }
  #fullscreenBtn { background: rgba(120, 80, 200, 0.85); border-color: rgba(180,140,255,0.5); }
  #resetBtn { background: rgba(200, 60, 60, 0.85); border-color: rgba(255,100,100,0.5); }
  
  /* Оверлеи */
  .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; backdrop-filter: blur(6px); z-index: 10; padding: 15px; }
  .overlay.show { display: flex; }
  .panel { background: linear-gradient(180deg, #2a3a4a, #1a2a3a); border: 2px solid rgba(100,180,255,0.4); border-radius: 16px; padding: 15px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.8); position: relative; }
  .panel h2 { color: #aaddff; margin: 0 0 12px; text-align: center; font-size: 18px; }
  .close-btn { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.1); border: none; color: #fff; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 18px; font-weight: bold; display: flex; justify-content: center; align-items: center; }
  
  /* Каталог */
  .section-title { color: #aaddff; font-size: 12px; font-weight: bold; margin: 10px 0 6px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(100,180,255,0.2); padding-bottom: 4px; }
  .fish-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  @media (min-width: 500px) { .fish-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; } }
  .fish-card { background: rgba(255,255,255,0.05); border: 2px solid rgba(100,180,255,0.2); border-radius: 8px; padding: 6px; text-align: left; transition: all 0.2s; }
  .fish-card.caught { border-color: rgba(100,255,100,0.5); background: rgba(100,255,100,0.05); }
  .fish-card.trash-card.caught { border-color: rgba(200,150,100,0.5); background: rgba(200,150,100,0.05); }
  .fish-card .emoji { font-size: 24px; display: block; margin-bottom: 2px; filter: grayscale(1) opacity(0.3); }
  .fish-card.caught .emoji, .fish-card.known .emoji { filter: none; }
  .fish-card .name { font-size: 11px; color: #ccc; font-weight: bold; margin-bottom: 2px; }
  .fish-card.caught .name, .fish-card.known .name { color: #fff; }
  .fish-card .pts { font-size: 10px; color: #ffd700; }
  .fish-card.trash-card .pts { color: #ff9966; }
  .fish-card .desc { font-size: 10px; color: #999; margin-top: 4px; line-height: 1.2; display: none; }
  .fish-card.caught .desc, .fish-card.known .desc { display: block; }

  /* Достижения */
  .achv-grid { display: grid; grid-template-columns: 1fr; gap: 6px; margin-top: 8px; }
  @media (min-width: 500px) { .achv-grid { grid-template-columns: 1fr 1fr; gap: 8px; } }
  .achv { padding: 8px; border-radius: 8px; background: rgba(255,215,0,0.05); border: 2px dashed rgba(255,215,0,0.3); }
  .achv.done { background: rgba(255,215,0,0.15); border-color: #ffd700; border-style: solid; }
  .achv.secret { background: rgba(150,150,150,0.05); border-color: rgba(150,150,150,0.3); border-style: dashed; }
  .achv.secret.done { background: rgba(255,100,100,0.15); border-color: #ff4444; border-style: solid; box-shadow: 0 0 20px rgba(255,50,50,0.4); }
  .achv .title { color: #ffd700; font-weight: bold; font-size: 12px; margin-bottom: 2px; }
  .achv.secret .title { color: #888; }
  .achv.secret.done .title { color: #ff4444; }
  .achv .desc { color: #aaa; font-size: 10px; line-height: 1.2; }
  .achv .bonus { font-size: 10px; color: #7fff7f; margin-top: 2px; font-weight: bold; }
  .achv .progress-bar { height: 4px; background: rgba(0,0,0,0.3); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .achv .progress-fill { height: 100%; background: #ffd700; border-radius: 2px; }

  /* Магазин */
  .shop-tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
  .shop-tab { flex: 1; min-width: 70px; padding: 6px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 6px; color: #aaa; font-weight: bold; font-size: 11px; cursor: pointer; }
  .shop-tab.active { background: rgba(100,180,255,0.15); border-color: #aaddff; color: #fff; }
  
  .shop-item { display: flex; align-items: center; gap: 8px; padding: 8px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 6px; border: 1px solid rgba(255,255,255,0.1); }
  .shop-item .icon { font-size: 20px; width: 30px; text-align: center; }
  .shop-item .info { flex: 1; }
  .shop-item .name { color: #fff; font-weight: bold; font-size: 12px; }
  .shop-item .desc { color: #aaa; font-size: 10px; margin-top: 2px; line-height: 1.2; }
  .shop-item .bonus { color: #7fff7f; font-size: 10px; margin-top: 2px; font-weight: bold; }
  .shop-item .buy-btn { background: #4CAF50; color: #fff; border: none; padding: 6px 8px; border-radius: 6px; font-weight: bold; font-size: 10px; cursor: pointer; min-width: 60px; }
  .shop-item .buy-btn:disabled { background: #555; cursor: not-allowed; opacity: 0.6; }
  .shop-item.owned { border-color: rgba(100,255,100,0.4); background: rgba(100,255,100,0.08); }
  .shop-item.equipped { border-color: #ffd700; background: rgba(255,215,0,0.1); }
  .shop-item.harpoon { border-color: rgba(255,100,100,0.5); background: rgba(255,100,100,0.1); }

  /* Тосты */
  #achvToast, #toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: bold; opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s; text-align: center; border: 2px solid #fff; z-index: 20; width: 90%; max-width: 350px; }
  #achvToast { background: linear-gradient(180deg, #ffd700, #ffa000); color: #1a1a1a; }
  #achvToast.show, #toast.show { opacity: 1; transform: translateX(-50%) translateY(10px); }
  #toast { top: 50%; transform: translate(-50%, -50%); border-color: #4CAF50; background: rgba(0,0,0,0.9); width: auto; padding: 12px 24px; }
  #toast.show { transform: translate(-50%, -50%) scale(1.05); }

  /* Выбор персонажа */
  #charSelect { background: rgba(10, 15, 25, 0.95); }
  .char-select-panel { text-align: center; }
  .char-select-panel h2 { font-size: 24px; margin-bottom: 8px; color: #fff; }
  .char-select-panel p { color: #aaa; margin-bottom: 20px; font-size: 13px; }
  .char-options { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
  .char-card { background: rgba(255,255,255,0.05); border: 3px solid rgba(100,180,255,0.2); border-radius: 12px; padding: 15px; width: 140px; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
  .char-card:active { border-color: #aaddff; background: rgba(100,180,255,0.1); transform: translateY(-3px); }
  .char-card canvas { width: 90px; height: 90px; border-radius: 50%; background: rgba(0,0,0,0.3); margin-bottom: 8px; object-fit: contain; display: block; }
  .char-card .char-name { color: #fff; font-weight: bold; font-size: 15px; }
  .char-card .char-desc { color: #888; font-size: 11px; margin-top: 2px; }

  /* QTE (Мобилка) */
  #qteControls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; gap: 15px; z-index: 15; touch-action: none; }
  #qteControls.show { display: flex; }
  .qte-btn { width: 70px; height: 70px; border-radius: 50%; background: rgba(200, 40, 40, 0.8); border: 3px solid #ff6666; color: #fff; font-size: 30px; font-weight: bold; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 20px rgba(255,60,60,0.5); user-select: none; cursor: pointer; }
  .qte-btn:active { transform: scale(0.9); background: #ff4444; }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game"></canvas>
  
  <!-- Кнопки перенесены вниз, чтобы не перекрывать игру -->
  <div class="top-panel">
    <button id="soundBtn" class="btn" onclick="toggleSound(event)">🔊</button>
    <button id="fullscreenBtn" class="btn" onclick="toggleFullscreen(event)">📺</button>
    <button id="resetBtn" class="btn" onclick="resetProgress(event)">🗑</button>
    <button id="catalogBtn" class="btn" onclick="toggleCatalog(event)">📖 Каталог</button>
    <button id="shopBtn" class="btn" onclick="toggleShop(event)">🛒 Магазин</button>
  </div>

  <div id="qteControls">
    <div class="qte-btn" data-key="ArrowLeft">←</div>
    <div class="qte-btn" data-key="ArrowUp">↑</div>
    <div class="qte-btn" data-key="ArrowDown">↓</div>
    <div class="qte-btn" data-key="ArrowRight">→</div>
  </div>
  
  <div id="charSelect" class="overlay show" onclick="if(event.target===this) {}">
    <div class="panel char-select-panel">
      <h2>🎣 Кто сегодня рыбачит?</h2>
      <p>Выбери персонажа. Повлияет только на внешний вид.</p>
      <div class="char-options">
        <div class="char-card" onclick="selectCharacter('fisher', event)">
          <canvas id="previewFisher" width="120" height="120"></canvas>
          <div class="char-name">Рыбак</div>
        </div>
        <div class="char-card" onclick="selectCharacter('fisherwoman', event)">
          <canvas id="previewFisherwoman" width="120" height="120"></canvas>
          <div class="char-name">Рыбачка</div>
        </div>
      </div>
    </div>
  </div>

  <div id="catalogOverlay" class="overlay" onclick="if(event.target===this) toggleCatalog(event)">
    <div class="panel">
      <button class="close-btn" onclick="toggleCatalog(event)">×</button>
      <h2>📖 Каталог уловов</h2>
      <div class="section-title">🐟 Рыбы</div>
      <div class="fish-grid" id="fishGrid"></div>
      <div class="section-title">🗑 Мусор</div>
      <div class="fish-grid" id="trashGrid"></div>
      <div class="section-title">🏆 Достижения</div>
      <div class="achv-grid" id="achvGrid"></div>
    </div>
  </div>

  <div id="shopOverlay" class="overlay" onclick="if(event.target===this) toggleShop(event)">
    <div class="panel">
      <button class="close-btn" onclick="toggleShop(event)">×</button>
      <h2>🛒 Магазин</h2>
      <div style="text-align:center; font-size: 18px; color: #ffd700; font-weight: bold; margin-bottom: 10px;">Очки: <span id="shopScore">0</span></div>
      <div class="shop-tabs">
        <button class="shop-tab active" id="tabUpgrades" onclick="switchShopTab('upgrades')">⚙️ Прокачка</button>
        <button class="shop-tab" id="tabRods" onclick="switchShopTab('rods')">🎣 Удочки</button>
        <button class="shop-tab" id="tabBooks" onclick="switchShopTab('books')">📕 Справочники</button>
      </div>
      <div id="shopItems"></div>
    </div>
  </div>
  
  <div id="achvToast">🏆 Достижение!</div>
  <div id="toast">Прогресс сброшен!</div>
</div>

<script>
// ==================================================================
// ЧАСТЬ 1: КОНСТАНТЫ И ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
// ==================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 900, H = 600;

const S = { IDLE: 'idle', CASTING: 'casting', WAITING: 'waiting', BITE: 'bite', REELING: 'reeling', RETURNING: 'returning', RESULT: 'result', BOSS_INTRO: 'boss_intro', BOSS_QTE: 'boss_qte', BOSS_DEATH: 'boss_death', BOSS_WIN: 'boss_win' };
let state = S.IDLE;
let stateTime = 0;

let score = parseInt(localStorage.getItem('fishScore') || '0');
let bestScore = parseInt(localStorage.getItem('fishBest') || '0');
let totalCaught = parseInt(localStorage.getItem('fishTotal') || '0');
let catalog = JSON.parse(localStorage.getItem('fishCatalog') || '{}');
let upgrades = JSON.parse(localStorage.getItem('fishUpgrades') || '{"reel":0, "zone":0, "luck":0}');
let hasBait = localStorage.getItem('fishHasBait') === 'true';
let ownedRods = JSON.parse(localStorage.getItem('fishOwnedRods') || '["bamboo"]');
let equippedRod = localStorage.getItem('fishRodSkin') || 'bamboo';
let encyclopedia = JSON.parse(localStorage.getItem('fishEncyclopedia') || '{}');
let achievements = JSON.parse(localStorage.getItem('fishNewAchievements') || '{}');
let bossDefeated = localStorage.getItem('fishBossDefeated') === 'true';
let hasHarpoon = localStorage.getItem('fishHasHarpoon') === 'true';
let harpoonInShop = localStorage.getItem('fishHarpoonInShop') === 'true';
let bossMet = localStorage.getItem('fishBossMet') === 'true';

let catchStreak = 0, missStreak = 0;
let character = localStorage.getItem('fishCharacter') || null;

const WEATHERS = ['day', 'sunset', 'night', 'rain', 'fog'];
const WEATHER_ICONS = { day: '☀️', sunset: '🌅', night: '🌙', rain: '🌧️', fog: '🌫️' };
let currentWeatherIndex = 0, weatherTimer = 0, gameTimeMinutes = 6 * 60;
const WEATHER_DURATION = 45;

function getWeather() { return WEATHERS[currentWeatherIndex]; }
function getNextWeather() { return WEATHERS[(currentWeatherIndex + 1) % WEATHERS.length]; }
function changeWeather() { currentWeatherIndex = (currentWeatherIndex + 1) % WEATHERS.length; weatherTimer = 0; }
function updateGameTime(dt) { gameTimeMinutes += dt; if (gameTimeMinutes >= 24 * 60) gameTimeMinutes -= 24 * 60; }
function formatTime() { const h = Math.floor(gameTimeMinutes / 60) % 24; const m = Math.floor(gameTimeMinutes) % 60; return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`; }

const FISH_DESCRIPTIONS = {
  'Окунь':         { where: 'Мелководье', when: 'День, закат', how: 'Клюёт часто. Идеален для новичков.' },
  'Карась':        { where: 'Заводи', when: 'День', how: 'Медленно берёт, но стабильно.' },
  'Щука':          { where: 'У камышей', when: 'Закат, туман', how: 'Хищник. Шанс выше на закате.' },
  'Сом':           { where: 'Глубина', when: 'Ночь', how: 'Редкий. Ночью шанс ×3.' },
  'Золотая рыбка': { where: 'Глубина', when: 'Закат', how: 'Очень редкая. На закате шанс ×3. Не клюёт ночью.' },
  'Форель':        { where: 'Холодная вода', when: 'День', how: 'Любит прохладную воду.' },
  'Лещ':           { where: 'Омуты', when: 'День', how: 'Стайная рыба.' },
  'Ёрш':           { where: 'Песчаное дно', when: 'Любое', how: 'Мелкая рыба, ловится всегда.' },
  'Плотва':        { where: 'Поверхность', when: 'День', how: 'Мелкая, но частая.' },
  'Карп':          { where: 'Глубина', when: 'Закат, туман', how: 'Редкий. Требует наживки.' },
  'Угорь':         { where: 'Коряги', when: 'Ночь', how: 'Редкий. Ночью шанс ×3.' },
  'Ботинок':       { where: 'Дно', when: 'Любое', how: 'Мусор. Хорошо клюёт в начале.' },
  'Бутылка':       { where: 'Дно', when: 'Дождь', how: 'Мусор. В дождь чаще.' },
  'Шина':          { where: 'Дно', when: 'Любое', how: 'Крупный мусор.' },
  'Банка':         { where: 'Дно', when: 'Любое', how: 'Мелкий мусор.' }
};

const BOOKS = [
  { id: 'bookОкунь',    name: '📕 Справочник окуня',    cost: 50,  opens: ['Окунь', 'Ёрш', 'Плотва'] },
  { id: 'bookКарась',   name: '📕 Справочник карася',   cost: 80,  opens: ['Карась', 'Лещ'] },
  { id: 'bookЩука',     name: '📕 Справочник щуки',     cost: 150, opens: ['Щука', 'Форель'] },
  { id: 'bookСом',      name: '📕 Справочник сома',     cost: 250, opens: ['Сом', 'Угорь'] },
  { id: 'bookЗолотая',  name: '📕 Справочник золотой',  cost: 400, opens: ['Золотая рыбка', 'Карп'] },
  { id: 'bookМусор',    name: '📕 Справочник мусора',   cost: 60,  opens: ['Ботинок', 'Бутылка', 'Шина', 'Банка'] }
];

const FISH_TYPES = [
  { name: 'Окунь',         color: '#e8a020', size: 25, pts: 10,  baseWeight: 30, emoji: '🐟', isTrash: false, isRare: false },
  { name: 'Карась',        color: '#d4b048', size: 30, pts: 15,  baseWeight: 25, emoji: '🐠', isTrash: false, isRare: false },
  { name: 'Щука',          color: '#4a8a3a', size: 45, pts: 30,  baseWeight: 15, emoji: '🦈', isTrash: false, isRare: false },
  { name: 'Сом',           color: '#5a4a3a', size: 55, pts: 50,  baseWeight: 8,  emoji: '🐋', isTrash: false, isRare: true },
  { name: 'Золотая рыбка', color: '#ffd700', size: 25, pts: 100, baseWeight: 2,  emoji: '✨', isTrash: false, isRare: true },
  { name: 'Форель',        color: '#c08060', size: 35, pts: 40,  baseWeight: 4,  emoji: '🐡', isTrash: false, isRare: false },
  { name: 'Лещ',           color: '#8a7a5a', size: 38, pts: 25,  baseWeight: 5,  emoji: '🎏', isTrash: false, isRare: false },
  { name: 'Ёрш',           color: '#6a7a8a', size: 20, pts: 8,   baseWeight: 6,  emoji: '🐟', isTrash: false, isRare: false },
  { name: 'Плотва',        color: '#aab0a0', size: 22, pts: 12,  baseWeight: 8,  emoji: '🐠', isTrash: false, isRare: false },
  { name: 'Карп',          color: '#b08040', size: 50, pts: 60,  baseWeight: 2,  emoji: '🐳', isTrash: false, isRare: true },
  { name: 'Угорь',         color: '#4a5a4a', size: 60, pts: 70,  baseWeight: 3,  emoji: '🐍', isTrash: false, isRare: true },
  { name: 'Ботинок',       color: '#3a3a3a', size: 35, pts: 1,   baseWeight: 6,  emoji: '👢', isTrash: true, isRare: false },
  { name: 'Бутылка',       color: '#4a8a4a', size: 28, pts: 1,   baseWeight: 6,  emoji: '🍾', isTrash: true, isRare: false },
  { name: 'Шина',          color: '#1a1a1a', size: 45, pts: 1,   baseWeight: 6,  emoji: '🛞', isTrash: true, isRare: false },
  { name: 'Банка',         color: '#8a8a9a', size: 20, pts: 1,   baseWeight: 6,  emoji: '🥫', isTrash: true, isRare: false }
];
const FISH_ONLY = FISH_TYPES.filter(f => !f.isTrash);
const TRASH_ONLY = FISH_TYPES.filter(f => f.isTrash);

const ROD_SKINS = {
  bamboo: { name: 'Бамбуковая', emoji: '🎋', price: 0, bonus: 0, color1: '#8B4513', color2: '#a06030', lineColor: 'rgba(255,255,255,0.4)', glow: false },
  spinning: { name: 'Спиннинг', emoji: '🎣', price: 500, bonus: 0.02, color1: '#2a3a4a', color2: '#4a5a6a', lineColor: 'rgba(200,220,255,0.5)', glow: false },
  carbon: { name: 'Карбоновая', emoji: '⚫', price: 1500, bonus: 0.05, color1: '#1a1a1a', color2: '#3a3a3a', lineColor: 'rgba(180,180,200,0.6)', glow: false },
  gold: { name: 'Золотая', emoji: '👑', price: 5000, bonus: 0.10, color1: '#b8860b', color2: '#ffd700', lineColor: 'rgba(255,215,0,0.7)', glow: true }

function initAudio() {

function playSound(type) {
  if (!soundEnabled || !audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;
  if (type === 'cast') {
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.2);
    gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.2);
  } else if (type === 'splash') {
    const bufferSize = audioCtx.sampleRate * 0.3; const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const source = audioCtx.createBufferSource(); source.buffer = buffer;
    const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 1000;
    const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    source.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); source.start(now);
  } else if (type === 'bite') {
    [880, 1320].forEach((freq, i) => {
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq; gain.gain.setValueAtTime(0.2, now + i * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.15);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.15);
    });
  } else if (type === 'reel') {
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'sawtooth'; osc.frequency.value = 120; gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.1);
  } else if (type === 'catch') {
    [523, 659, 784, 1046].forEach((freq, i) => {
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'triangle'; osc.frequency.value = freq; gain.gain.setValueAtTime(0.15, now + i * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.3);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.3);
    });
  } else if (type === 'rare') {
    [659, 784, 987, 1318, 1568].forEach((freq, i) => {
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'triangle'; osc.frequency.value = freq; gain.gain.setValueAtTime(0.2, now + i * 0.07);
      gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.07 + 0.4);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now + i * 0.07); osc.stop(now + i * 0.07 + 0.4);
    });
  } else if (type === 'achv') {
    [523, 659, 784, 1046, 1318].forEach((freq, i) => {
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq; gain.gain.setValueAtTime(0.2, now + i * 0.1);
      gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.5);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now + i * 0.1); osc.stop(now + i * 0.1 + 0.5);
    });
  } else if (type === 'miss') {
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
    gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.3);
  } else if (type === 'buy') {
    [660, 880].forEach((freq, i) => {
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'square'; osc.frequency.value = freq; gain.gain.setValueAtTime(0.1, now + i * 0.05);
      gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.05 + 0.15);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now + i * 0.05); osc.stop(now + i * 0.05 + 0.15);
    });
  } else if (type === 'roar') {
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(60, now); osc.frequency.linearRampToValueAtTime(40, now + 1.5);
    gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 1.5);
  } else if (type === 'hurt') {
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'square'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
    gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.3);
  }
}
function startAmbientSound() {
  if (!soundEnabled || !audioCtx || bgNoiseNode) return;
  const bufferSize = audioCtx.sampleRate * 2; const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.1;
  const source = audioCtx.createBufferSource(); source.buffer = buffer; source.loop = true;
  const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 400;
  const gain = audioCtx.createGain(); gain.gain.value = 0.15;
  source.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); source.start(); bgNoiseNode = { source, gain };
}
function stopAmbientSound() {
  if (bgNoiseNode) { try { bgNoiseNode.source.stop(); } catch(e) {} bgNoiseNode = null; }
}
function toggleSound(e) {
  if (e) e.stopPropagation();
  soundEnabled = !soundEnabled;
  localStorage.setItem('fishSoundEnabled', soundEnabled);
  document.getElementById('soundBtn').textContent = soundEnabled ? '🔊' : '🔇';
  if (soundEnabled) { initAudio(); if (!bgNoiseNode) startAmbientSound(); playSound('buy'); } else { stopAmbientSound(); }
}
function ensureAudioStarted() {
  if (!audioCtx) initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  if (soundEnabled && audioCtx && !bgNoiseNode) startAmbientSound();
}

  }

const SHOP_ITEMS = [
  { id: 'reel', name: '⚡ Скорость', desc: 'Замедляет индикатор', max: 5, baseCost: 50, costMult: 2 },
  { id: 'zone', name: '🎯 Зона', desc: 'Шире зелёная зона', max: 5, baseCost: 60, costMult: 2 },
  { id: 'luck', name: '🍀 Удача', desc: 'Меньше мусора', max: 5, baseCost: 80, costMult: 2.5 },

];
let currentShopTab = 'upgrades';
function getShopCost(item) {
  if (item.isConsumable) return item.baseCost;
  const currentLvl = upgrades[item.id] || 0;
  return Math.floor(item.baseCost * Math.pow(item.costMult, currentLvl));
}
function buyUpgrade(id) {
  const item = SHOP_ITEMS.find(i => i.id === id);
  const cost = getShopCost(item);
  if (score < cost) return;
  if (item.isConsumable) { if (hasBait) return; hasBait = true; }
  else { if ((upgrades[id] || 0) >= item.max) return; upgrades[id] = (upgrades[id] || 0) + 1; }
  score -= cost; playSound('buy'); saveProgress(); renderShop(); checkNewAchievements();
}
function buyRod(rodId) {
  const skin = ROD_SKINS[rodId];
  if (ownedRods.includes(rodId)) { equippedRod = rodId; playSound('buy'); saveProgress(); renderShop(); return; }
  if (score < skin.price) return;
  score -= skin.price; ownedRods.push(rodId); equippedRod = rodId; playSound('buy'); saveProgress(); renderShop(); checkNewAchievements(); vibrate(100);
}
function buyBook(bookId) {
  const book = BOOKS.find(b => b.id === bookId);
  if (!book || encyclopedia[bookId] || score < book.cost) return;
  score -= book.cost; encyclopedia[bookId] = true;
  book.opens.forEach(f => { if (!catalog[f]) catalog[f] = 0; });
  playSound('buy'); saveProgress(); renderShop(); checkNewAchievements();
}
function buyHarpoon() {
  if (hasHarpoon || score < 1000) return;
  score -= 1000;
  hasHarpoon = true;
  playSound('buy'); saveProgress(); renderShop();
}
function switchShopTab(tab) {
  currentShopTab = tab;
  document.getElementById('tabUpgrades').classList.toggle('active', tab === 'upgrades');
  document.getElementById('tabRods').classList.toggle('active', tab === 'rods');
  document.getElementById('tabBooks').classList.toggle('active', tab === 'books');
  renderShop();
}
function toggleShop(e) { if (e) e.stopPropagation(); const overlay = document.getElementById('shopOverlay'); overlay.classList.toggle('show'); if (overlay.classList.contains('show')) renderShop(); else document.getElementById('catalogOverlay').classList.remove('show'); }

function renderShop() {
  document.getElementById('shopScore').textContent = score;
  const container = document.getElementById('shopItems');
  
  if (currentShopTab === 'upgrades') {
    container.innerHTML = SHOP_ITEMS.map(item => {
      const cost = getShopCost(item);
      const lvl = item.isConsumable ? (hasBait ? 1 : 0) : (upgrades[item.id] || 0);
      const isMax = !item.isConsumable && lvl >= item.max;
      const canBuy = !isMax && !(item.isConsumable && hasBait) && score >= cost;
      let btnText = isMax ? 'MAX' : `Купить (${cost})`;
      if (item.isConsumable && hasBait) btnText = 'Есть';
      return `
        <div class="shop-item">
          <div class="icon">${item.name.split(' ')[0]}</div>
          <div class="info"><div class="name">${item.name.substring(2)} ${!item.isConsumable ? `(ур. ${lvl}/${item.max})` : ''}</div><div class="desc">${item.desc}</div></div>
          <button class="buy-btn" onclick="buyUpgrade('${item.id}')" ${canBuy ? '' : 'disabled'}>${btnText}</button>
        </div>`;
    }).join('');
  } else if (currentShopTab === 'rods') {
    let html = Object.entries(ROD_SKINS).map(([id, skin]) => {
      const owned = ownedRods.includes(id);
      const equipped = equippedRod === id;
      let btnText, canBuy;
      if (equipped) { btnText = '✓ Выбрано'; canBuy = false; }
      else if (owned) { btnText = 'Выбрать'; canBuy = true; }
      else { btnText = `Купить (${skin.price})`; canBuy = score >= skin.price; }
      const cls = equipped ? 'equipped' : owned ? 'owned' : '';
      return `
        <div class="shop-item ${cls}">
          <div class="icon">${skin.emoji}</div>
          <div class="info"><div class="name">${skin.name}</div>${skin.bonus > 0 ? `<div class="bonus">+${(skin.bonus * 100).toFixed(0)}% к шансу редкой рыбы</div>` : `<div class="desc">Стандартная удочка</div>`}</div>
          <button class="buy-btn" onclick="buyRod('${id}')" ${canBuy ? '' : 'disabled'}>${btnText}</button>
        </div>`;
    }).join('');
    
    if (harpoonInShop && !hasHarpoon) {
      html += `
        <div class="shop-item harpoon">
          <div class="icon">🔱</div>
          <div class="info"><div class="name">Гарпун Левиафана</div><div class="desc">Пассивно усиливает вас при охоте на Кита</div></div>
          <button class="buy-btn" onclick="buyHarpoon()" ${score >= 1000 ? '' : 'disabled'}>Купить (1000)</button>
        </div>`;
    } else if (hasHarpoon) {
      html += `
        <div class="shop-item equipped">
          <div class="icon">🔱</div>
          <div class="info"><div class="name">Гарпун Левиафана</div><div class="desc">Куплен и готов к бою!</div></div>
          <button class="buy-btn" disabled>✓ Есть</button>
        </div>`;
    }
    container.innerHTML = html;
  } else if (currentShopTab === 'books') {
    container.innerHTML = BOOKS.map(book => {
      const owned = encyclopedia[book.id];
      const canBuy = !owned && score >= book.cost;
      return `
        <div class="shop-item ${owned ? 'owned' : ''}">
          <div class="icon">📕</div>
          <div class="info"><div class="name">${book.name}</div><div class="desc">Открывает: ${book.opens.join(', ')}</div></div>
          <button class="buy-btn" onclick="buyBook('${book.id}')" ${canBuy ? '' : 'disabled'}>${owned ? '✓ Куплено' : `Купить (${book.cost})`}</button>
        </div>`;
    }).join('');
  }
}

function addToCatalog(name) {
  if (!catalog[name]) catalog[name] = 0;
  catalog[name]++;
  if (getWeather() === 'night') achievements.nightCount = (achievements.nightCount || 0) + 1;
  saveProgress();

}

function toggleCatalog(e) { if (e) e.stopPropagation(); const overlay = document.getElementById('catalogOverlay'); overlay.classList.toggle('show'); if (overlay.classList.contains('show')) renderCatalog(); else document.getElementById('shopOverlay').classList.remove('show'); }
function isFishKnown(fishName) {

function addParticles(x, y, color, count, spread = 4) {
  for (let i = 0; i < count; i++) particles.push({ x, y, vx: (Math.random()-0.5)*spread*2, vy: (Math.random()-0.5)*spread*2-1, life: 1, color, size: 2+Math.random()*4 });
}
function addRipple(x, y) { rippleEffects.push({ x, y, radius: 5, life: 1 }); }
function addFloatingText(text, x, y, color) { floatingTexts.push({ text, x, y, color, life: 1.5, vy: -50 }); }

function resetProgress(e) {

  score = 0; bestScore = 0; totalCaught = 0; catalog = {}; upgrades = {reel:0, zone:0, luck:0}; hasBait = false;
  ownedRods = ['bamboo']; equippedRod = 'bamboo'; encyclopedia = {}; achievements = {}; bossDefeated = false; hasHarpoon = false; harpoonInShop = false; bossMet = false;

function getCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  let clientX, clientY;
  if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
  else if (e.changedTouches && e.changedTouches.length > 0) { clientX = e.changedTouches[0].clientX; clientY = e.changedTouches[0].clientY; }
  else { clientX = e.clientX; clientY = e.clientY; }
  
  // Т.к. canvas вписывается через object-fit: contain, пересчитываем пропорционально
  const canvasAspect = W / H; const rectAspect = rect.width / rect.height;
  let renderedW, renderedH, offsetX, offsetY;
  
  if (rectAspect > canvasAspect) {
    renderedH = rect.height; renderedW = rect.height * canvasAspect;
  } else {
    renderedW = rect.width; renderedH = rect.width / canvasAspect;
  }
  offsetX = (rect.width - renderedW) / 2; offsetY = (rect.height - renderedH) / 2;
  
  const scale = renderedW / W;
  return { x: (clientX - rect.left - offsetX) / scale, y: (clientY - rect.top - offsetY) / scale };
}

let touchTimeout = null;
let swipe = { active: false, startX: 0, startY: 0, curX: 0, curY: 0 };

function handleInput(e) {
  ensureAudioStarted();
  if (document.querySelector('.overlay.show')) return;
  if (state === S.BOSS_QTE) return;
  
  if (e.type === 'touchstart' && e.touches && e.touches.length > 0) {
    e.preventDefault();
    if (touchTimeout) return;
    touchTimeout = setTimeout(() => { touchTimeout = null; }, 200);
  }
  const { x, y } = getCanvasCoords(e);
  bobber.mx = x; bobber.my = y;
  handleAction(x, y);
}

function handleAction(mx, my) {
  if (state === S.IDLE) castRod(mx, my);
  else if (state === S.BITE) startReeling();
  else if (state === S.REELING) checkReel();
  else if (state === S.RESULT && stateTime > 0.8) resetToIdle();
  else if (state === S.BOSS_INTRO && stateTime > 2.5) { state = S.BOSS_QTE; startQte(); }
  else if (state === S.BOSS_DEATH && stateTime > 3) { state = S.IDLE; stateTime = 0; }
  else if (state === S.BOSS_WIN && stateTime > 3) { state = S.IDLE; stateTime = 0; }
}

function handleSwipeStart(e) {
  ensureAudioStarted();
  if (state === S.BOSS_QTE) return;
  if (document.querySelector('.overlay.show')) return;
  if (state !== S.IDLE) { handleInput(e); return; }
  e.preventDefault();
  const { x, y } = getCanvasCoords(e);
  swipe.active = true; swipe.startX = x; swipe.startY = y; swipe.curX = x; swipe.curY = y;
}
function handleSwipeMove(e) {
  if (!swipe.active) return;
  e.preventDefault();
  const { x, y } = getCanvasCoords(e);
  swipe.curX = x; swipe.curY = y;
}
function handleSwipeEnd(e) {
  if (!swipe.active) return;
  e.preventDefault();
  swipe.active = false;
  const dx = swipe.curX - swipe.startX; const dy = swipe.curY - swipe.startY;
  if (Math.hypot(dx, dy) > 50 && dy > 0) castRod(swipe.curX, swipe.curY);
  else handleInput(e);
}

canvas.addEventListener('mousedown', handleInput);
canvas.addEventListener('contextmenu', (e) => { e.preventDefault(); handleInput(e); });
canvas.addEventListener('touchstart', handleSwipeStart, { passive: false });
canvas.addEventListener('touchmove', handleSwipeMove, { passive: false });
canvas.addEventListener('touchend', handleSwipeEnd, { passive: false });

window.addEventListener('keydown', (e) => {
  if (state === S.BOSS_QTE) {

    if (document.querySelector('.overlay.show')) return;

    if (state === S.BITE) { startReeling(); return; }
    if (state === S.IDLE) { handleAction(bobber.mx, bobber.my); return; }
    handleAction(0, 0);
  }
});

function castRod(mx, my) {
  if (checkBossTrigger() && !bossDefeated) {
    startBossFight();
    return;
  }
  bobber.x = rod.tipX; bobber.y = rod.tipY;
  bobber.tx = Math.max(300, Math.min(W - 60, mx));
  bobber.ty = Math.max(340, Math.min(H - 60, my));
  const dx = bobber.tx - bobber.x, dy = bobber.ty - bobber.y;
  const dist = Math.hypot(dx, dy);
  const flightTime = Math.max(0.3, dist / 900);
  bobber.vx = dx / flightTime; bobber.vy = dy / flightTime - 400 * flightTime;
  state = S.CASTING; stateTime = 0;
  playSound('cast'); vibrate(30);
}

function startReeling() {
  state = S.REELING; stateTime = 0;
  reelPos = 0; lastReelSoundTime = 0;
  let speedReduction = (upgrades.reel || 0) * 0.15;
  if (achievements.trashman) speedReduction += 0.15;
  if (achievements.rodmaster) speedReduction += 0.10;
  let difficultyMultiplier = 1;
  if (catchStreak >= 3) difficultyMultiplier = 1 + (catchStreak - 2) * 0.15;
  if (missStreak >= 2) difficultyMultiplier = Math.max(0.5, 1 - (missStreak - 1) * 0.2);
  reelSpeed = (85 + Math.random() * 40) * Math.max(0.2, 1 - speedReduction) * difficultyMultiplier;
  zoneStart = 35 + Math.random() * 25;
  let baseZone = 18 + Math.random() * 12;
  let bonusZone = (upgrades.zone || 0) * 4;
  if (achievements.trashman) bonusZone += 4;
  let finalZone = baseZone + bonusZone;
  if (catchStreak >= 3) finalZone *= 0.8;
  if (missStreak >= 2) finalZone *= 1.3;
  zoneEnd = Math.min(95, zoneStart + finalZone);
  addParticles(bobber.x, bobber.y, '#fff', 15);
  addRipple(bobber.x, bobber.y);
  vibrate(80);
}

function pickFish() {
  const w = getWeather();
  const trashMult = getTrashMultiplier();
  const allTrashCollected = TRASH_ONLY.every(f => catalog[f.name] > 0);
  const rareBonus = ROD_SKINS[equippedRod]?.bonus || 0;
  
  const adjusted = FISH_TYPES.map(f => {
    let weight = f.baseWeight;
    if (f.isTrash) {
      weight *= trashMult;
      if (allTrashCollected) {
        const luckReduction = 1 - (upgrades.luck || 0) * 0.15;
        weight *= Math.max(0.05, luckReduction);
      } else {
        weight = Math.max(1, weight);
      }
    }
    if (w === 'night') {
      if (f.name === 'Сом' || f.name === 'Угорь') weight *= 3;
      if (f.name === 'Золотая рыбка') weight = 0;
    } else if (w === 'sunset') {
      if (f.name === 'Золотая рыбка') weight *= 3;
      if (f.name === 'Щука') weight *= 1.5;
    } else if (w === 'fog') {
      if (!f.isTrash) weight *= 1.5;
    } else if (w === 'rain') {
      if (f.isTrash) weight *= 1.2;
    }
    if (hasBait && !f.isTrash && f.isRare) weight *= 3;
    if (!f.isTrash && f.isRare) weight *= (1 + rareBonus);
    if (w === 'night' && achievements.night && !f.isTrash && f.isRare) weight *= 1.05;
    return { ...f, weight };
  });
  
  const total = adjusted.reduce((s, f) => s + f.weight, 0);
  let r = Math.random() * total;
  for (const f of adjusted) { r -= f.weight; if (r <= 0) return f; }
  return adjusted[0];
}

function getTrashMultiplier() {
  const caughtCount = Object.values(catalog).reduce((a, b) => a + b, 0);
  if (caughtCount < 10) return 2.5;
  if (caughtCount < 25) return 1.8;
  if (caughtCount < 50) return 1.3;
  return 0.8;
}

function checkReel() {
  if (reelPos >= zoneStart && reelPos <= zoneEnd) {
    catchStreak++; missStreak = 0;
    const fish = pickFish();
    lastCatch = fish;
    let points = fish.pts;
    if (achievements.collector) points = Math.floor(points * 1.1);
    if (achievements.pro) points = Math.floor(points * 1.05);
    if (achievements.millionaire) points = Math.floor(points * 1.02);
    score += points; totalCaught++;
    if (score > bestScore) bestScore = score;
    if (hasBait) hasBait = false;
    addToCatalog(fish.name);
    state = S.RETURNING; stateTime = 0;
    addParticles(bobber.x, bobber.y, fish.color, 25, 6);
    addRipple(bobber.x, bobber.y);
    addFloatingText(`+${points}`, bobber.x, bobber.y - 20, fish.color);
    if (fish.isRare) { playSound('rare'); vibrate([50, 30, 50, 30, 100]); }
    else { playSound('catch'); vibrate(50); }
  } else {
    catchStreak = 0; missStreak++;
    state = S.RESULT; stateTime = 0;
    addFloatingText('Сорвалась!', bobber.x, bobber.y - 20, '#ff6666');
    playSound('miss'); vibrate([50, 50, 50]);
  }
}
function resetToIdle() { state = S.IDLE; stateTime = 0; lastCatch = null; }

function startBossFight() {

  saveProgress();
  playSound('roar');

function startQte() {

  qteSequence = [];
  const isSecondFight = hasHarpoon;
  const length = isSecondFight ? 5 : 8;
  const baseTime = isSecondFight ? 1.8 : 0.45;
  
  for (let i = 0; i < length; i++) {
    qteSequence.push({
      key: BOSS_KEYS[Math.floor(Math.random() * BOSS_KEYS.length)],
      time: baseTime
    });
  }
  qteMaxTime = baseTime;
  qteTimer = qteMaxTime;
  document.getElementById('qteControls').classList.add('show');
}

function handleQteKey(key) {
  if (state !== S.BOSS_QTE) return;
  if (qteSequence[qteIndex] && qteSequence[qteIndex].key === key) {
    qteIndex++;
    qteTimer = qteSequence[qteIndex] ? qteSequence[qteIndex].time : 0;
    playSound('buy');
    vibrate(30);
    if (qteIndex >= qteSequence.length) winBossFight();

    loseBossFight();
  }
}

document.querySelectorAll('.qte-btn').forEach(btn => {

  btn.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); if (state === S.BOSS_QTE) handleQteKey(btn.dataset.key); }, { passive: false });

function winBossFight() {

  vibrate([200, 100, 200]);

// ==================================================================
// ЧАСТЬ 9: ОБНОВЛЕНИЕ (ИГРОВАЯ ЛОГИКА)
// ==================================================================
function update(dt) {
  stateTime += dt;
  weatherTimer += dt;
  updateGameTime(dt);
  const t = performance.now() / 1000;
  
  if (state !== S.BOSS_INTRO && state !== S.BOSS_QTE && state !== S.BOSS_DEATH && state !== S.BOSS_WIN) {
    if (weatherTimer > WEATHER_DURATION) changeWeather();
  }
  
  if (boss) {
    if (state === S.BOSS_INTRO) {
      boss.y += (boss.targetY - boss.y) * 0.05;
      boss.shake = Math.sin(t * 30) * 5;
      if (boss.y > boss.targetY + 5) boss.y = boss.targetY;
    } else if (state === S.BOSS_DEATH) {
      boss.y += 200 * dt;
    } else if (state === S.BOSS_WIN) {
      boss.y -= 100 * dt;
    }
  }

  if (state === S.BOSS_QTE) {
    qteTimer -= dt;
    if (qteTimer <= 0) loseBossFight();
  }
  
  for (const f of bgFish) {
    f.x += f.speed * f.dir; f.wobble += dt * 3; f.y += Math.sin(f.wobble) * 0.3;
    if (f.x > W + 40) { f.x = -40; f.y = 340 + Math.random() * 230; }
    if (f.x < -40) { f.x = W + 40; f.y = 340 + Math.random() * 230; }
  }
  for (const b of bubbles) {
    b.y -= b.speed; b.x += Math.sin(t + b.y * 0.05) * 0.3;
    if (b.y < 320) { b.y = H; b.x = Math.random() * W; }
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 8 * dt; p.life -= dt * 1.5;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = rippleEffects.length - 1; i >= 0; i--) {
    const r = rippleEffects[i]; r.radius += dt * 60; r.life -= dt * 1.2;
    if (r.life <= 0) rippleEffects.splice(i, 1);
  }
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i]; ft.y += ft.vy * dt; ft.vy *= 0.95; ft.life -= dt * 1.2;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }
  
  if (getWeather() === 'rain') {
    for (const r of rainDrops) {
      r.y += r.speed * dt;
      if (r.y > H) { r.y = -20; r.x = Math.random() * W; }
    }
  }
  
  if (state === S.CASTING) {
    bobber.x += bobber.vx * dt; bobber.y += bobber.vy * dt; bobber.vy += 800 * dt;
    if (bobber.y >= bobber.ty && bobber.vy > 0) {
      bobber.y = bobber.ty; state = S.WAITING; stateTime = 0;
      bobber.waitSeed = 1.5 + Math.random() * 4;
      addRipple(bobber.x, bobber.y); addParticles(bobber.x, bobber.y, '#aaddff', 10);
      playSound('splash'); vibrate(30);
    }
  } else if (state === S.WAITING) {
    bobber.phase += dt * 2;
    if (stateTime > (bobber.waitSeed || 3)) {
      state = S.BITE; stateTime = 0;
      addParticles(bobber.x, bobber.y, '#fff', 20); addRipple(bobber.x, bobber.y);
      playSound('bite'); vibrate([100, 50, 100]);
    }
  } else if (state === S.BITE) {
    if (stateTime > 0.9) { state = S.RESULT; stateTime = 0; addFloatingText('Сорвалась!', bobber.x, bobber.y - 30, '#ff6666'); missStreak++; }
  } else if (state === S.REELING) {
    reelPos += reelSpeed * dt;
    if (performance.now() - lastReelSoundTime > 120) { playSound('reel'); lastReelSoundTime = performance.now(); }
    if (reelPos > 100) { state = S.RESULT; stateTime = 0; addFloatingText('Сорвалась!', bobber.x, bobber.y - 30, '#ff6666'); missStreak++; catchStreak = 0; }
  } else if (state === S.RETURNING) {
    const progress = Math.min(1, stateTime / 0.8);
    const ease = 1 - Math.pow(1 - progress, 3);
    bobber.x = bobber.tx + (rod.tipX - bobber.tx) * ease;
    bobber.y = bobber.ty + (rod.tipY - bobber.ty) * ease;
    if (progress >= 1) { state = S.RESULT; stateTime = 0; }
  } else if (state === S.RESULT) {
    if (stateTime > 2) resetToIdle();
  }
}

function drawFishBody(x, y, size, color, dir = 1, alpha = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(dir, 1); ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.ellipse(0, 0, size, size * 0.45, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-size * 0.9, 0); ctx.lineTo(-size * 1.5, -size * 0.5); ctx.lineTo(-size * 1.5, size * 0.5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(size * 0.5, -size * 0.1, size * 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawTrashBody(x, y, size, color, emoji) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(0, 0, size * 0.8, size * 0.6, 0, 0, Math.PI * 2); ctx.fill();

    if (state === S.BOSS_DEATH) {
      ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, W, H);
      ctx.font = 'bold 44px "Segoe UI", sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#ff4444';
      ctx.fillText('КИТ ПОБЕДИЛ!', W/2, 120);
      ctx.font = 'bold 28px "Segoe UI", sans-serif'; ctx.fillStyle = '#ff8888';
      ctx.fillText('❌ Потеряно:', W/2, 190);
      ctx.font = '22px "Segoe UI", sans-serif'; ctx.fillStyle = '#fff';
      ctx.fillText('Коллекция рыб', W/2, 225);
      ctx.fillText('Достижение «Коллекционер»', W/2, 255);
      ctx.font = 'bold 28px "Segoe UI", sans-serif'; ctx.fillStyle = '#88ff88';
      ctx.fillText('✅ Сохранено:', W/2, 310);
      ctx.font = '22px "Segoe UI", sans-serif'; ctx.fillStyle = '#fff';
      ctx.fillText('Очки, прокачка, удочки, мусор', W/2, 345);
      ctx.fillStyle = 'rgba(255, 215, 0, 0.2)'; ctx.beginPath(); ctx.roundRect(W/2 - 300, 390, 600, 100, 16); ctx.fill();
      ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 3; ctx.stroke();
      ctx.font = 'bold 22px "Segoe UI", sans-serif'; ctx.fillStyle = '#ffd700';
      ctx.fillText('💡 Совет:', W/2, 425);
      ctx.font = '18px "Segoe UI", sans-serif'; ctx.fillStyle = '#fff';
      ctx.fillText('Купите «Гарпун Левиафана» в магазине,', W/2, 455);
      ctx.fillText('чтобы победить Кита в следующий раз!', W/2, 480);
      if (stateTime > 3) {
        ctx.font = '16px "Segoe UI", sans-serif'; ctx.fillStyle = '#aaa';
        ctx.fillText('Кликни, чтобы продолжить', W/2, 560);
      }
    }
    
    if (state === S.BOSS_WIN) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
      ctx.font = 'bold 44px "Segoe UI", sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#ffd700';
      ctx.fillText('ЛЕВИАФАН ПОВЕРЖЕН!', W/2, H/2 - 60);
      ctx.font = '28px "Segoe UI", sans-serif'; ctx.fillStyle = '#fff';
      ctx.fillText('+5000 очков', W/2, H/2);
      ctx.fillStyle = '#aaffaa'; ctx.font = '22px "Segoe UI", sans-serif';
      ctx.fillText('Кит больше никогда не появится.', W/2, H/2 + 50);
      if (stateTime > 3) {
        ctx.font = '16px "Segoe UI", sans-serif'; ctx.fillStyle = '#aaa';
        ctx.fillText('Кликни, чтобы продолжить', W/2, H/2 + 120);
      }
    }
    
    drawHints();
    return;
  }
  
  drawEnvironment(t);
  
  for (const r of rippleEffects) {
    ctx.strokeStyle = `rgba(200, 230, 255, ${r.life * 0.6})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(r.x, r.y, r.radius, r.radius * 0.3, 0, 0, Math.PI * 2); ctx.stroke();
  }
  
  if (state !== S.IDLE) {
    let by = bobber.y;
    if (state === S.WAITING) by += Math.sin(bobber.phase * 2) * 3;
    else if (state === S.BITE) by += Math.sin(t * 30) * 6;
    else if ((state === S.RETURNING || state === S.RESULT) && lastCatch) {
      if (lastCatch.isTrash) drawTrashBody(bobber.x, by + 22, lastCatch.size * 0.7, lastCatch.color, lastCatch.emoji);
      else drawFishBody(bobber.x, by + 22, lastCatch.size * 0.8, lastCatch.color, 1, 1);
    }
    drawBobber(bobber.x, by);
  }
  
  drawFisherman();
  
  const skin = ROD_SKINS[equippedRod] || ROD_SKINS.bamboo;
  if (skin.glow) { ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 10; }
  ctx.strokeStyle = skin.color1; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(rod.baseX, rod.baseY); ctx.quadraticCurveTo(140, 420, rod.tipX, rod.tipY); ctx.stroke();
  ctx.strokeStyle = skin.color2; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(140, 420); ctx.quadraticCurveTo(165, 400, rod.tipX, rod.tipY); ctx.stroke();
  ctx.shadowBlur = 0;
  
  if (swipe.active) drawSwipeIndicator();
  
  for (const p of particles) { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); }
  ctx.globalAlpha = 1;
  
  for (const ft of floatingTexts) {
    ctx.globalAlpha = Math.min(1, ft.life * 2); ctx.font = 'bold 24px "Segoe UI", sans-serif'; ctx.textAlign = 'center';
    ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 4; ctx.strokeText(ft.text, ft.x, ft.y);
    ctx.fillStyle = ft.color; ctx.fillText(ft.text, ft.x, ft.y);
  }
  ctx.globalAlpha = 1;
  
  drawUI();
  if (state === S.REELING) drawReelUI();
  drawHints();
}

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
    this.beginPath(); this.moveTo(x + r.tl, y); this.lineTo(x + w - r.tr, y);
    this.quadraticCurveTo(x + w, y, x + w, y + r.tr); this.lineTo(x + w, y + h - r.br);
    this.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h); this.lineTo(x + r.bl, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r.bl); this.lineTo(x, y + r.tl);
    this.quadraticCurveTo(x, y, x + r.tl, y); this.closePath(); return this;
  };
}

let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
