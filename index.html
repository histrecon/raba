<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐟 Уплывающая рыбка</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    height: 100%;
    background: linear-gradient(180deg, #001f3f 0%, #003366 50%, #005580 100%);
    font-family: system-ui, sans-serif;
  }
  canvas {
    display: block;
    cursor: crosshair;
  }
  #hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.6);
    font-size: 14px;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hint">Нажми на рыбку — она уплывёт 🐟</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ---------- Пузырьки на фоне ----------
const bubbles = Array.from({ length: 40 }, () => ({
  x: Math.random() * W,
  y: Math.random() * H,
  r: 1 + Math.random() * 4,
  speed: 0.3 + Math.random() * 1.2,
  offset: Math.random() * Math.PI * 2
}));

// ---------- Рыбка ----------
const fish = {
  x: W / 2,
  y: H / 2,
  vx: 2,
  vy: 0.5,
  size: 40,
  angle: 0,
  tailPhase: 0,
  scared: 0,          // таймер испуга
  maxSpeed: 6
};

// ---------- Взаимодействие ----------
function distanceToFish(px, py) {
  // приблизительная зона клика (тело + хвост)
  const dx = px - fish.x;
  const dy = py - fish.y;
  return Math.hypot(dx, dy);
}

function scareFish(px, py) {
  const dx = fish.x - px;
  const dy = fish.y - py;
  const dist = Math.hypot(dx, dy) || 1;

  // уплываем в противоположную сторону от курсора
  const boost = 14;
  fish.vx += (dx / dist) * boost;
  fish.vy += (dy / dist) * boost;

  fish.scared = 60; // кадров испуга
}

canvas.addEventListener('pointerdown', (e) => {
  if (distanceToFish(e.clientX, e.clientY) < fish.size * 1.6) {
    scareFish(e.clientX, e.clientY);
  }
});

// (опционально) рыбка реагирует и на близкое наведение курсора
canvas.addEventListener('pointermove', (e) => {
  const d = distanceToFish(e.clientX, e.clientY);
  if (d < fish.size * 1.2 && fish.scared <= 0) {
    scareFish(e.clientX, e.clientY);
  }
});

// ---------- Обновление ----------
function update() {
  // естественное замедление
  fish.vx *= 0.97;
  fish.vy *= 0.97;

  // спокойное плавание, если не напугана
  if (fish.scared <= 0) {
    fish.vx += (Math.random() - 0.5) * 0.15;
    fish.vy += (Math.random() - 0.5) * 0.1;

    // небольшое притяжение к центру, чтобы не залипала у краёв
    fish.vx += (W / 2 - fish.x) * 0.00005;
    fish.vy += (H / 2 - fish.y) * 0.00005;
  } else {
    fish.scared--;
  }

  // ограничение скорости
  const sp = Math.hypot(fish.vx, fish.vy);
  const max = fish.scared > 0 ? fish.maxSpeed * 2 : fish.maxSpeed;
  if (sp > max) {
    fish.vx = (fish.vx / sp) * max;
    fish.vy = (fish.vy / sp) * max;
  }

  fish.x += fish.vx;
  fish.y += fish.vy;

  // отражение от краёв
  const margin = fish.size;
  if (fish.x < margin) { fish.x = margin; fish.vx = Math.abs(fish.vx); }
  if (fish.x > W - margin) { fish.x = W - margin; fish.vx = -Math.abs(fish.vx); }
  if (fish.y < margin) { fish.y = margin; fish.vy = Math.abs(fish.vy); }
  if (fish.y > H - margin) { fish.y = H - margin; fish.vy = -Math.abs(fish.vy); }

  // поворот по направлению движения
  if (sp > 0.2) {
    const target = Math.atan2(fish.vy, fish.vx);
    // плавный поворот
    let diff = target - fish.angle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    fish.angle += diff * 0.15;
  }

  // фаза хвоста — быстрее, когда плывёт быстрее
  fish.tailPhase += 0.15 + sp * 0.05;

  // пузырьки
  for (const b of bubbles) {
    b.y -= b.speed;
    b.x += Math.sin(b.offset + b.y * 0.02) * 0.3;
    if (b.y < -10) {
      b.y = H + 10;
      b.x = Math.random() * W;
    }
  }
}

// ---------- Отрисовка ----------
function drawBubbles() {
  ctx.fillStyle = 'rgba(200, 230, 255, 0.25)';
  for (const b of bubbles) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawFish() {
  ctx.save();
  ctx.translate(fish.x, fish.y);
  ctx.rotate(fish.angle);

  const s = fish.size;
  const tailWag = Math.sin(fish.tailPhase) * 0.5;

  // Свечение, когда напугана
  if (fish.scared > 0) {
    ctx.shadowColor = 'rgba(255, 150, 100, 0.9)';
    ctx.shadowBlur = 25;
  } else {
    ctx.shadowColor = 'rgba(120, 200, 255, 0.6)';
    ctx.shadowBlur = 15;
  }

  // Хвост
  ctx.fillStyle = fish.scared > 0 ? '#ff8a5c' : '#ffb347';
  ctx.beginPath();
  ctx.moveTo(-s * 0.7, 0);
  ctx.lineTo(-s * 1.4, -s * 0.6 + tailWag * 10);
  ctx.lineTo(-s * 1.4, s * 0.6 + tailWag * 10);
  ctx.closePath();
  ctx.fill();

  // Тело
  const grad = ctx.createLinearGradient(-s, 0, s, 0);
  if (fish.scared > 0) {
    grad.addColorStop(0, '#ff6b3d');
    grad.addColorStop(1, '#ffd166');
  } else {
    grad.addColorStop(0, '#ff9a3d');
    grad.addColorStop(1, '#ffd97a');
  }
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(0, 0, s, s * 0.6, 0, 0, Math.PI * 2);
  ctx.fill();

  // Плавник сверху
  ctx.fillStyle = fish.scared > 0 ? '#ff8a5c' : '#ffb347';
  ctx.beginPath();
  ctx.moveTo(-s * 0.2, -s * 0.5);
  ctx.lineTo(-s * 0.5, -s * 0.9);
  ctx.lineTo(s * 0.1, -s * 0.55);
  ctx.closePath();
  ctx.fill();

  // Плавник снизу
  ctx.beginPath();
  ctx.moveTo(-s * 0.2, s * 0.45);
  ctx.lineTo(-s * 0.5, s * 0.85);
  ctx.lineTo(s * 0.1, s * 0.5);
  ctx.closePath();
  ctx.fill();

  // Глаз
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(s * 0.55, -s * 0.15, s * 0.16, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(s * 0.6, -s * 0.15, s * 0.08, 0, Math.PI * 2);
  ctx.fill();

  // Блик
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath();
  ctx.arc(s * 0.63, -s * 0.2, s * 0.03, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// ---------- Цикл ----------
function loop() {
  ctx.clearRect(0, 0, W, H);

  drawBubbles();
  update();
  drawFish();

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
