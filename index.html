<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ============================================================
//  ПАЛИТРА
// ============================================================
const INK       = '#1a3a8f';
const INK_DARK  = '#0d2470';
const INK_LIGHT = '#5a78c8';
const INK_FAINT = '#c8d4f0';
const PAPER     = '#fdfdfd';

// ============================================================
//  УРОВНИ
// ============================================================
const levels = [
  {
    spawn: { x: 100, y: 560 },
    goal: { x: 1600, y: 480 },
    platforms: [
      { x: 0, y: 560, w: 1800, h: 200 },
      { x: 300, y: 460, w: 150, h: 20 },
      { x: 550, y: 380, w: 150, h: 20 },
      { x: 800, y: 460, w: 200, h: 20 },
      { x: 1150, y: 400, w: 150, h: 20 },
      { x: 1400, y: 480, w: 300, h: 200 },
    ],
    ladders: [
      { x: 380, y: 380, w: 40, h: 180 },
      { x: 880, y: 380, w: 40, h: 180 },
    ],
    coins: [
      { x: 350, y: 430 }, { x: 400, y: 430 },
      { x: 600, y: 350 }, { x: 650, y: 350 },
      { x: 900, y: 430 }, { x: 950, y: 430 },
      { x: 1200, y: 370 }, { x: 1250, y: 370 },
    ],
    spikes: [{ x: 700, y: 540, w: 60, h: 20 }],
  },
  {
    spawn: { x: 80, y: 620 },
    goal: { x: 1700, y: 300 },
    platforms: [
      { x: 0, y: 620, w: 500, h: 200 },
      { x: 400, y: 500, w: 200, h: 20 },
      { x: 700, y: 420, w: 200, h: 20 },
      { x: 1000, y: 500, w: 200, h: 20 },
      { x: 1300, y: 420, w: 200, h: 20 },
      { x: 1550, y: 300, w: 300, h: 300 },
      { x: 1550, y: 620, w: 60, h: 200 },
    ],
    ladders: [
      { x: 460, y: 420, w: 40, h: 200 },
      { x: 760, y: 340, w: 40, h: 180 },
      { x: 1060, y: 420, w: 40, h: 180 },
      { x: 1360, y: 340, w: 40, h: 180 },
      { x: 1580, y: 200, w: 40, h: 200 },
    ],
    coins: [
      { x: 450, y: 470 }, { x: 500, y: 470 },
      { x: 750, y: 390 }, { x: 800, y: 390 },
      { x: 1050, y: 470 }, { x: 1100, y: 470 },
      { x: 1350, y: 390 }, { x: 1400, y: 390 },
      { x: 1600, y: 270 }, { x: 1700, y: 270 },
    ],
    spikes: [
      { x: 550, y: 600, w: 100, h: 20 },
      { x: 1150, y: 600, w: 100, h: 20 },
    ],
  },
  {
    spawn: { x: 60, y: 640 },
    goal: { x: 1750, y: 200 },
    platforms: [
      { x: 0, y: 640, w: 400, h: 200 },
      { x: 500, y: 580, w: 200, h: 20 },
      { x: 800, y: 500, w: 200, h: 20 },
      { x: 1100, y: 580, w: 200, h: 20 },
      { x: 1400, y: 500, w: 200, h: 20 },
      { x: 1650, y: 200, w: 250, h: 500 },
      { x: 1700, y: 620, w: 60, h: 60 },
    ],
    ladders: [
      { x: 550, y: 500, w: 40, h: 180 },
      { x: 850, y: 420, w: 40, h: 180 },
      { x: 1150, y: 500, w: 40, h: 180 },
      { x: 1450, y: 420, w: 40, h: 180 },
      { x: 1680, y: 120, w: 40, h: 180 },
    ],
    coins: [
      { x: 550, y: 550 }, { x: 600, y: 550 },
      { x: 850, y: 470 }, { x: 900, y: 470 },
      { x: 1150, y: 550 }, { x: 1200, y: 550 },
      { x: 1450, y: 470 }, { x: 1500, y: 470 },
      { x: 1700, y: 170 }, { x: 1800, y: 170 },
    ],
    spikes: [
      { x: 380, y: 620, w: 120, h: 20 },
      { x: 1000, y: 620, w: 100, h: 20 },
      { x: 1300, y: 620, w: 100, h: 20 },
    ],
  },
];

// ============================================================
//  КОНСТАНТЫ
// ============================================================
const GRAVITY      = 0.5;
const STEP_DIST    = 20;
const STEP_TIME    = 14;
const JUMP_FORCE   = -10;
const CLIMB_SPEED  = 1.4;
const FULL_H       = 56;
const CROUCH_H     = 36;

const player = {
  x: 0, y: 0,
  w: 24, h: FULL_H,
  vx: 0, vy: 0,
  onGround: false,
  onLadder: false,
  crouching: false,
  facing: 1,
  animTime: 0,
  spawnX: 0, spawnY: 0,

  stepping: false,
  stepProgress: 0,
  stepFromX: 0,
  stepToX: 0,
};

let currentLevel = 0;
let state = 'playing';
let coinsTotal = 0;
let coinsCollected = 0;
let deaths = 0;
let camera = { x: 0, y: 0 };
let levelCoins = [], levelSpikes = [], levelPlatforms = [], levelLadders = [];
let levelGoal = null;
let levelWidth = 0, levelHeight = 800;

// ============================================================
//  ВВОД  ✅ FIX: очередь нажатий вместо флага "только что"
// ============================================================
const keys = {};
// очередь шагов: 'left' | 'right' — обрабатывается в updatePlayer
let stepQueue = [];

const KEY_MAP = {
  'KeyA': 'right',
  'KeyD': 'left',
  'KeyW': 'up',
  'KeyS': 'down',
  'ArrowUp': 'up',
  'ArrowLeft': 'left',
  'ArrowRight': 'right',
  'ArrowDown': 'down',
  'Space': 'up',
};

window.addEventListener('keydown', (e) => {
  const a = KEY_MAP[e.code];
  if (a) {
    // ✅ ставим шаг в очередь ТОЛЬКО при первом нажатии (не при автоповторе)
    if (!keys[a]) {
      if (a === 'left' || a === 'right') stepQueue.push(a);
    }
    keys[a] = true;
    e.preventDefault();
  }
  if (e.code === 'KeyR') resetLevel();
});
window.addEventListener('keyup', (e) => {
  const a = KEY_MAP[e.code];
  if (a) { keys[a] = false; e.preventDefault(); }
});
window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  stepQueue = [];
});

// ============================================================
//  УРОВЕНЬ
// ============================================================
function loadLevel(index) {
  currentLevel = index;
  const lvl = levels[index];
  levelPlatforms = lvl.platforms.map(p => ({ ...p }));
  levelLadders   = lvl.ladders.map(l => ({ ...l }));
  levelCoins     = lvl.coins.map(c => ({ ...c, collected: false }));
  levelSpikes    = lvl.spikes ? lvl.spikes.map(s => ({ ...s })) : [];
  levelGoal      = { ...lvl.goal };
  levelWidth     = Math.max(
    ...levelPlatforms.map(p => p.x + p.w),
    ...levelLadders.map(l => l.x + l.w),
    levelGoal.x + 100
  );
  levelHeight = 800;
  player.spawnX = lvl.spawn.x;
  player.spawnY = lvl.spawn.y;
  respawnPlayer();
  coinsTotal = levelCoins.length;
  coinsCollected = 0;
  state = 'playing';
  updateHUD();
  showMessage('');
}

function respawnPlayer() {
  player.h = FULL_H;
  player.x = player.spawnX;
  player.y = player.spawnY - player.h;
  player.vx = 0;
  player.vy = 0;
  player.onGround = false;
  player.onLadder = false;
  player.crouching = false;
  player.facing = 1;
  player.stepping = false;
  player.stepProgress = 0;
  stepQueue = [];
  camera.x = player.x - W / 2;
  camera.y = player.y - H / 2;
}

function resetLevel() {
  if (state === 'win' && currentLevel < levels.length - 1) loadLevel(currentLevel + 1);
  else loadLevel(currentLevel);
}

function updateHUD() {
  document.getElementById('lvl').textContent = currentLevel + 1;
  document.getElementById('lvlTotal').textContent = levels.length;
  document.getElementById('coinCount').textContent = coinsCollected;
  document.getElementById('coinTotal').textContent = coinsTotal;
  document.getElementById('deathCount').textContent = deaths;
}

function showMessage(text, sub = '') {
  const el = document.getElementById('message');
  if (text) {
    el.innerHTML = text + (sub ? `<small>${sub}</small>` : '');
    el.classList.add('show');
  } else {
    el.classList.remove('show');
  }
}

// ============================================================
//  КОЛЛИЗИИ
// ============================================================
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}
function playerRect() {
  return { x: player.x, y: player.y, w: player.w, h: player.h };
}
function isOnLadder() {
  const pr = playerRect();
  for (const l of levelLadders) {
    if (pr.x + pr.w > l.x && pr.x < l.x + l.w &&
        pr.y + pr.h > l.y && pr.y < l.y + l.h) return true;
  }
  return false;
}
function canStepTo(newX) {
  const test = { x: newX, y: player.y, w: player.w, h: player.h };
  for (const p of levelPlatforms) {
    if (rectsOverlap(test, p)) return false;
  }
  return true;
}

// ============================================================
//  ШАГ
// ============================================================
function startStep(direction) {
  if (player.stepping) return;
  if (player.crouching) return;

  const targetX = player.x + direction * STEP_DIST;
  if (!canStepTo(targetX)) {
    // упёрлись в стену — не двигаемся
    return;
  }
  player.facing = direction;
  player.stepFromX = player.x;
  player.stepToX = targetX;
  player.stepProgress = 0;
  player.stepping = true;
}

function updateStep() {
  if (!player.stepping) return;
  player.stepProgress += 1 / STEP_TIME;

  if (player.stepProgress >= 1) {
    player.x = player.stepToX;
    player.stepProgress = 0;
    player.stepping = false;
    return;
  }
  const t = player.stepProgress;
  const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  player.x = player.stepFromX + (player.stepToX - player.stepFromX) * eased;
  player.animTime += 0.25;
}

// ============================================================
//  UPDATE
// ============================================================
function updatePlayer() {
  const up   = keys['up'];
  const down = keys['down'];

  player.onLadder = isOnLadder();

  if (player.onLadder) {
    // ============ ЛЕСТНИЦА ============
    player.stepping = false;
    player.crouching = false;
    if (up)        player.vy = -CLIMB_SPEED;
    else if (down) player.vy =  CLIMB_SPEED;
    else           player.vy = 0;

    // на лестнице A/D тоже шагают вбок, но через очередь
    if (!player.stepping && stepQueue.length) {
      const dir = stepQueue.shift();
      startStep(dir === 'right' ? 1 : -1);
    }
    updateStep();

    if (up && player.onGround) {
      player.vy = JUMP_FORCE;
      player.onLadder = false;
    }
  } else {
    // ============ ОБЫЧНОЕ ДВИЖЕНИЕ ============
    player.crouching = down && player.onGround;

    // изменение высоты при приседе
    if (player.crouching && player.h !== CROUCH_H) {
      const diff = FULL_H - CROUCH_H;
      player.y += diff;
      player.h = CROUCH_H;
    } else if (!player.crouching && player.h !== FULL_H) {
      const diff = FULL_H - CROUCH_H;
      const test = { x: player.x, y: player.y - diff, w: player.w, h: diff };
      let blocked = false;
      for (const p of levelPlatforms) {
        if (rectsOverlap(test, p)) { blocked = true; break; }
      }
      if (!blocked) {
        player.y -= diff;
        player.h = FULL_H;
      }
    }

    // ✅ ШАГ: берём из очереди (только если ещё не шагаем)
    if (!player.stepping && stepQueue.length) {
      const dir = stepQueue.shift();
      startStep(dir === 'right' ? 1 : -1);
    }
    updateStep();

    // прыжок
    if (up && player.onGround && !player.crouching) {
      player.vy = JUMP_FORCE;
      player.onGround = false;
      player.stepping = false;
      player.stepProgress = 0;
    }

    // гравитация
    player.vy += GRAVITY;
    if (player.vy > 13) player.vy = 13;
  }

  // Вертикальное движение
  player.y += player.vy;

  // ✅ FIX: НЕ трогаем player.x здесь — им управляет updateStep()
  // Единственное исключение — на лестнице, если не шагаем и нажата клавиша
  if (player.onLadder && !player.stepping) {
    // можно чуть сдвинуться вбок, но мы уже обрабатываем это через шаги
  }

  if (player.x < 0) { player.x = 0; player.stepping = false; }

  resolveCollisionsY();  // сначала по Y (пол/потолок)

  // Проверки
  if (player.y > levelHeight + 300) { die(); return; }

  for (const s of levelSpikes) {
    if (rectsOverlap(playerRect(), s)) { die(); return; }
  }

  for (const c of levelCoins) {
    if (c.collected) continue;
    const cr = { x: c.x - 12, y: c.y - 12, w: 24, h: 24 };
    if (rectsOverlap(playerRect(), cr)) {
      c.collected = true;
      coinsCollected++;
      updateHUD();
    }
  }

  const gr = { x: levelGoal.x - 20, y: levelGoal.y - 80, w: 40, h: 80 };
  if (rectsOverlap(playerRect(), gr)) win();
}

function resolveCollisionsX() {
  // больше не используем (шаги сами проверяют canStepTo)
}
function resolveCollisionsY() {
  player.onGround = false;
  for (const p of levelPlatforms) {
    if (rectsOverlap(playerRect(), p)) {
      if (player.vy > 0) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      } else if (player.vy < 0) {
        player.y = p.y + p.h;
        player.vy = 0;
      }
    }
  }
}

function die() {
  deaths++;
  updateHUD();
  state = 'dead';
  showMessage('Упс!', 'Респавн...');
  setTimeout(() => {
    if (state === 'dead') {
      respawnPlayer();
      state = 'playing';
      showMessage('');
    }
  }, 700);
}

function win() {
  state = 'win';
  if (currentLevel < levels.length - 1) {
    showMessage('Уровень пройден!', 'Нажми R для следующего');
  } else {
    showMessage('Победа!', 'Все уровни пройдены. R — сыграть снова');
  }
}

function updateCamera() {
  const tx = player.x + player.w / 2 - W / 2;
  const ty = player.y + player.h / 2 - H / 2;
  camera.x += (tx - camera.x) * 0.08;
  camera.y += (ty - camera.y) * 0.08;
  camera.x = Math.max(0, Math.min(camera.x, Math.max(0, levelWidth - W)));
  camera.y = Math.max(-100, Math.min(camera.y, Math.max(0, levelHeight - H)));
}

// ============================================================
//  ОТРИСОВКА
// ============================================================
function jitter(amount = 0.6) {
  return (Math.random() - 0.5) * amount;
}
function handLine(x1, y1, x2, y2, color = INK, width = 2) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.beginPath();
  const segs = 3;
  ctx.moveTo(x1 + jitter(), y1 + jitter());
  for (let i = 1; i <= segs; i++) {
    const t = i / segs;
    const x = x1 + (x2 - x1) * t + jitter(1.2);
    const y = y1 + (y2 - y1) * t + jitter(1.2);
    ctx.lineTo(x, y);
  }
  ctx.stroke();
}
function handRect(x, y, w, h, color = INK, width = 2) {
  handLine(x, y, x + w, y, color, width);
  handLine(x + w, y, x + w, y + h, color, width);
  handLine(x + w, y + h, x, y + h, color, width);
  handLine(x, y + h, x, y, color, width);
}
function handHatch(x, y, w, h, color = INK_FAINT, step = 8) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  for (let i = -h; i < w; i += step) {
    ctx.beginPath();
    ctx.moveTo(x + i, y + h);
    ctx.lineTo(x + i + h, y);
    ctx.stroke();
  }
}

function drawPaper() {
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  const cell = 28;
  const offX = (-camera.x * 0.25) % cell;
  const offY = (-camera.y * 0.25) % cell;
  ctx.strokeStyle = INK_FAINT;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = offX; x < W; x += cell) {
    ctx.moveTo(Math.round(x) + 0.5, 0);
    ctx.lineTo(Math.round(x) + 0.5, H);
  }
  for (let y = offY; y < H; y += cell) {
    ctx.moveTo(0, Math.round(y) + 0.5);
    ctx.lineTo(W, Math.round(y) + 0.5);
  }
  ctx.stroke();
  const marginX = 40 - camera.x * 0.15;
  if (marginX > 0 && marginX < W) {
    ctx.strokeStyle = INK_LIGHT;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(marginX, 0);
    ctx.lineTo(marginX, H);
    ctx.stroke();
  }
}

function drawPlatform(p) {
  handRect(p.x, p.y, p.w, p.h, INK, 2.2);
  handHatch(p.x + 3, p.y + 3, p.w - 6, p.h - 6, INK_FAINT, 9);
  handLine(p.x, p.y, p.x + p.w, p.y, INK_DARK, 3);
}

function drawLadder(l) {
  handLine(l.x, l.y, l.x, l.y + l.h, INK, 2);
  handLine(l.x + l.w, l.y, l.x + l.w, l.y + l.h, INK, 2);
  const step = 16;
  for (let y = l.y + step; y < l.y + l.h; y += step) {
    handLine(l.x, y, l.x + l.w, y, INK, 1.6);
  }
}

function drawCoin(c) {
  if (c.collected) return;
  const t = performance.now() / 300;
  const bounce = Math.sin(t + c.x * 0.1) * 2.5;
  ctx.save();
  ctx.translate(c.x, c.y + bounce);
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  const r = 11;
  for (let a = 0; a <= Math.PI * 2 + 0.01; a += Math.PI / 8) {
    const rr = r + jitter(1.4);
    const x = Math.cos(a) * rr;
    const y = Math.sin(a) * rr;
    if (a === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.strokeStyle = INK_LIGHT;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.6, 0, Math.PI * 1.5);
  ctx.stroke();
  ctx.restore();
}

function drawSpike(s) {
  const count = Math.floor(s.w / 12);
  const step = s.w / count;
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2;
  for (let i = 0; i < count; i++) {
    const x = s.x + i * step;
    ctx.beginPath();
    ctx.moveTo(x + jitter(0.5), s.y + s.h);
    ctx.lineTo(x + step / 2 + jitter(0.8), s.y);
    ctx.lineTo(x + step + jitter(0.5), s.y + s.h);
    ctx.stroke();
  }
  handLine(s.x, s.y + s.h, s.x + s.w, s.y + s.h, INK, 2.5);
}

function drawGoal() {
  const g = levelGoal;
  handLine(g.x, g.y, g.x, g.y - 80, INK, 2.5);
  const wave = Math.sin(performance.now() / 200) * 3;
  ctx.strokeStyle = INK_DARK;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(g.x, g.y - 80);
  ctx.quadraticCurveTo(g.x + 25 + wave, g.y - 65, g.x, g.y - 50);
  ctx.stroke();
  ctx.strokeStyle = INK_FAINT;
  ctx.lineWidth = 1;
  for (let i = 2; i < 30; i += 4) {
    ctx.beginPath();
    ctx.moveTo(g.x + i * 0.4, g.y - 80 + i);
    ctx.lineTo(g.x + i * 0.7, g.y - 80 + i + 3);
    ctx.stroke();
  }
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.5;
  const cx = g.x + 10, cy = g.y - 65;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + (i * 4 * Math.PI) / 5;
    const x = cx + Math.cos(a) * 6;
    const y = cy + Math.sin(a) * 6;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();
}

function drawPlayer() {
  ctx.save();
  ctx.translate(player.x + player.w / 2, player.y);

  if (player.onGround) {
    ctx.strokeStyle = INK_FAINT;
    ctx.lineWidth = 1.5;
    for (let i = -8; i <= 8; i += 4) {
      ctx.beginPath();
      ctx.moveTo(i, player.h + 2);
      ctx.lineTo(i + 2, player.h + 5);
      ctx.stroke();
    }
  }

  ctx.strokeStyle = INK;
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.scale(player.facing, 1);

  const h = player.h;
  const w = player.w;
  const swing = player.stepping ? Math.sin(player.animTime) * 0.5 : 0;
  const climbSwing = player.onLadder ? Math.sin(player.animTime) * 0.5 : 0;
  const bob = Math.abs(Math.sin(player.animTime)) * 1.5;

  const headR = w * 0.45;
  const headY = -h * 0.08 - h * 0.5 + bob * 0.3;
  ctx.beginPath();
  ctx.arc(0, headY, headR, 0, Math.PI * 2);
  ctx.stroke();

  const bodyTop = headY + headR;
  const bodyBottom = h * 0.55;
  const bodyMid = (bodyTop + bodyBottom) / 2;
  ctx.beginPath();
  ctx.moveTo(0, bodyTop);
  ctx.lineTo(0, bodyBottom);
  ctx.stroke();

  const legSwing = player.onLadder ? climbSwing : swing;
  ctx.beginPath();
  ctx.moveTo(0, bodyBottom);
  ctx.lineTo(-w * 0.35 + legSwing * 7, h - 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, bodyBottom);
  ctx.lineTo(w * 0.35 - legSwing * 7, h - 2);
  ctx.stroke();

  const armY = bodyTop + (bodyMid - bodyTop) * 0.9;
  const armSwing = player.onLadder ? climbSwing : swing;
  const armDrop = player.crouching ? 8 : 14;
  ctx.beginPath();
  ctx.moveTo(0, armY);
  ctx.lineTo(-w * 0.5 + armSwing * 5, armY + (player.onLadder ? -10 : armDrop));
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, armY);
  ctx.lineTo(w * 0.5 - armSwing * 5, armY + (player.onLadder ? 10 : armDrop));
  ctx.stroke();

  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.arc(-headR * 0.35, headY - 1, 1.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(headR * 0.35, headY - 1, 1.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(0, headY + 2, headR * 0.4, 0.2, Math.PI - 0.2);
  ctx.stroke();

  ctx.restore();
}

// ============================================================
//  ЦИКЛ
// ============================================================
function loop() {
  if (state === 'playing') {
    updatePlayer();
    updateCamera();
  }
  drawPaper();
  ctx.save();
  ctx.translate(-camera.x, -camera.y);
  for (const p of levelPlatforms) drawPlatform(p);
  for (const l of levelLadders) drawLadder(l);
  for (const s of levelSpikes) drawSpike(s);
  for (const c of levelCoins) drawCoin(c);
  drawGoal();
  drawPlayer();
  ctx.restore();
  requestAnimationFrame(loop);
}

loadLevel(0);
loop();
</script>
